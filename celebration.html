<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Highlighter Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --brand-color: #c92d9a;    /* Pink/Magenta */
            --keyword-color: #ebe538;  /* Yellow */
            --location-color: #15f5f7; /* Cyan */
            --text: #f1f5f9;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .workspace { max-width: 1200px; margin: 0 auto; }

        header {
            margin-bottom: 30px;
            border-left: 4px solid var(--primary);
            padding-left: 20px;
        }

        h1 { font-weight: 700; margin: 0; font-size: 1.8rem; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; }

        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }

        .step-tag {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; }

        textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            padding: 12px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            margin-bottom: 15px;
        }

        /* Editor Styles */
        .editor-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }

        .editor {
            min-height: 500px;
            background: #ffffff;
            color: #000000;
            padding: 30px;
            border-radius: 12px;
            outline: none;
            font-size: 12pt;
            overflow-y: auto;
        }

        /* Highlight Classes */
        .hl-brand { background: var(--brand-color); color: #000000; padding: 2px 4px; border-radius: 3px; }
        .hl-keyword { background: var(--keyword-color); color: #000000; padding: 2px 4px; border-radius: 3px; }
        .hl-location { background: var(--location-color); color: #000000; padding: 2px 4px; border-radius: 3px; }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .btn.primary { background: var(--primary); color: #0f172a; }
        .btn.outline { background: transparent; border: 1px solid #334155; color: white; }
        .btn.tool { background: #334155; color: white; padding: 5px 12px; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }

        /* Footer Stats */
        .summary-bar {
            position: sticky;
            bottom: 20px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--primary);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .stat-val { display: block; font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; }

        /* Unused Keywords */
        .unused-list { margin-bottom: 15px; }
        .unused-list h4 { font-size: 0.8rem; margin: 0 0 8px 0; padding-bottom: 5px; border-bottom: 1px solid #334155; }
        .unused-list ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
        .unused-list li { background: #2c3a4f; padding: 3px 10px; border-radius: 15px; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div class="workspace">
        <header>
            <h1>Celebration Highlighter</h1>
            <p class="subtitle">Native Editor Content Audit Tool</p>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <div class="card">
                    <span class="step-tag">Step 1: Setup</span>
                    
                    <label style="border-left: 3px solid var(--brand-color); padding-left: 8px;">Brand Names</label>
                    <textarea id="brand" rows="4" placeholder="Brand names..."></textarea>

                    <label style="border-left: 3px solid var(--keyword-color); padding-left: 8px;">Primary Keywords</label>
                    <textarea id="keywords" rows="4" placeholder="Target keywords..."></textarea>

                    <label style="border-left: 3px solid var(--location-color); padding-left: 8px;">Locations</label>
                    <textarea id="locations" rows="4" placeholder="Locations..."></textarea>
                </div>

                <div class="card" id="unused-keywords-card" style="display: none; margin-top: 20px;">
                    <span class="step-tag">Unused Keywords</span>
                    <div id="unused-keywords-container"></div>
                </div>
            </aside>

            <main class="editor-container">
                <div class="card">
                    <span class="step-tag">Step 2: Content</span>
                    
                    <div class="editor-toolbar">
                        <button class="btn tool" onclick="formatText('formatBlock', 'h1')">H1</button>
                        <button class="btn tool" onclick="formatText('formatBlock', 'h2')">H2</button>
                        <button class="btn tool" onclick="formatText('formatBlock', 'h3')">H3</button>
                        <button class="btn tool" onclick="formatText('formatBlock', 'p')">Body</button>
                        <button class="btn tool" onclick="formatText('bold')"><b>B</b></button>
                    </div>

                    <div id="editor-core" class="editor" contenteditable="true">
                        Paste your content here...
                    </div>
                    
                    <div class="actions" style="margin-top: 20px; display: flex; gap: 10px;">
                        <button class="btn primary" onclick="highlightText()">Run Highlight</button>
                        <button class="btn outline" onclick="downloadWord()">Export to Word</button>
                        <button class="btn outline" onclick="clearEditor()">Clear</button>
                    </div>
                </div>

                <div class="summary-bar">
                    <div class="stat"><span class="stat-val" id="count-brand">0</span><span class="stat-label">Brands</span></div>
                    <div class="stat"><span class="stat-val" id="count-keyword">0</span><span class="stat-label">Keywords</span></div>
                    <div class="stat"><span class="stat-val" id="count-location">0</span><span class="stat-label">Locations</span></div>
                </div>
            </main>
        </div>
    </div>

    <script src="celebration.js"></script>
</body>
</html>
