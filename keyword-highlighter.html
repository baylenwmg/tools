<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signal Highlighter | Content Intelligence</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --brand-color: #c92d9a;
      --keyword-color: #ebe538;
      --location-color: #15f5f7;
      --text: #f1f5f9;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .workspace { max-width: 1200px; margin: auto; }

    .main-layout {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
    }

    textarea {
      width: 100%;
      background: #0f172a;
      color: white;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .editor {
      background: white;
      color: #1e293b;
      min-height: 400px;
      padding: 30px;
      border-radius: 12px;
    }

    .hl-brand { background: var(--brand-color); color:#000; font-weight:bold; }
    .hl-keyword { background: var(--keyword-color); color:#fff; font-weight:bold; }
    .hl-location { background: var(--location-color); color:#000; font-weight:bold; }

    .summary-bar {
      position: sticky;
      bottom: 20px;
      margin-top: 20px;
      padding: 15px 30px;
      border-radius: 50px;
      background: rgba(30,41,59,.9);
      display: flex;
      justify-content: space-around;
    }

    .stat-val { font-weight: 800; color: var(--primary); font-size: 1.2rem; }
  </style>
</head>

<body>
<div class="workspace">
  <div class="main-layout">

    <aside class="card">
      <label>Brand Names</label>
      <textarea id="brand"></textarea>

      <label>Primary Keywords</label>
      <textarea id="keywords"></textarea>

      <label>Locations</label>
      <textarea id="locations"></textarea>
    </aside>

    <main>
      <div class="card">
        <div id="content" class="editor" contenteditable="true">
          <h1>Sample Heading</h1>
          <p>Paste your content here.</p>
        </div>

        <button onclick="runAudit()">Run Highlight</button>
        <button onclick="downloadWord()">Export Word</button>
      </div>

      <div class="summary-bar">
        <div><span class="stat-val" id="count-brand">0</span> Brands</div>
        <div><span class="stat-val" id="count-keyword">0</span> Keywords</div>
        <div><span class="stat-val" id="count-location">0</span> Locations</div>
      </div>
    </main>

  </div>
</div>

<script src="highlighter.js"></script>
</body>
</html>
