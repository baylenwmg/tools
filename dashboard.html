<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Project Dashboard</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
margin:0;
}

.header{
background:#24292e;
color:white;
padding:15px;
font-size:20px;
}

.logout{
float:right;
background:red;
padding:5px 10px;
cursor:pointer;
border-radius:4px;
}

.container{
padding:20px;
}

.login-box{
width:320px;
margin:100px auto;
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.15);
}

input, select{
padding:8px;
margin:5px;
}

button{
background:#2ea44f;
color:white;
border:none;
padding:8px 15px;
cursor:pointer;
border-radius:4px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
margin-top:10px;
}

th, td{
padding:8px;
border:1px solid #ddd;
font-size:14px;
}

.hidden{
display:none;
}

.controls{
background:white;
padding:10px;
border-radius:6px;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="header">
Project Dashboard
<span class="logout hidden" onclick="logout()">Logout</span>
</div>


<!-- LOGIN -->

<div id="login" class="login-box">

<h3>Login</h3>

<input id="userid" placeholder="Login ID"><br>
<input id="password" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="container hidden">

<h3 id="welcome"></h3>


<!-- ADMIN CONTROLS -->

<div id="adminControls" class="controls hidden">

<input type="text" id="searchBox" placeholder="Search Project..." onkeyup="filterProjects()">

<select id="associateFilter" onchange="filterProjects()">
<option value="">All Associates</option>
</select>

<span style="margin-left:20px;">
Completion: <b id="completionPercent">0%</b>
</span>

</div>


<table>

<thead>
<tr>

<th>Project Name</th>
<th>Transfer Ownership Email</th>

<th>Clarity Setup</th>
<th>Clarity Ownership</th>

<th>Bing Setup</th>
<th>Bing Ownership</th>

<th>GTM Access</th>
<th>GTM Ownership</th>

</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

</div>


<script>


// GOOGLE SHEET API
const API="https://script.google.com/macros/s/AKfycbyoHEPOPy89C0ST9KjYBMDPFmJoUVu0EE0i6A0Q8vCPxYi4kPzU07ECJvYaBmhS_qiY/exec";


// USERS
const users={

admin:{password:"admin@123",name:"Admin"},

user001:{password:"lrgUeJyCZ1",name:"Dipen"},
user002:{password:"s6xrLqjSaR",name:"Dishank"},
user003:{password:"zwfTRCO3Hp",name:"Harshil"},
user004:{password:"ll6qBvtf9E",name:"Jaimin"},
user005:{password:"r4WoT6wMZ3",name:"Kushal"},
user006:{password:"IaIoXs8ToJ",name:"Nikhil R"},
user007:{password:"nWEyIeRGc3",name:"Nitin"},
user008:{password:"gAH2WJ50ep",name:"Pratik"},
user009:{password:"lltLX0aTXP",name:"Prerak"},
user010:{password:"JEIBPrBpAj",name:"Riddhi"},
user011:{password:"dIwmBesG6P",name:"Rohan"},
user012:{password:"Ss8bDRtey0",name:"Shefali"},
user013:{password:"h9T6bZnNmr",name:"Twinkle"}

};


let projects=[];
let filteredProjects=[];


// LOGIN

function login(){

let id=userid.value;
let pass=password.value;

if(users[id] && users[id].password==pass){

localStorage.user=id;
showDashboard();

}else alert("Invalid login");

}


// SHOW DASHBOARD

async function showDashboard(){

login.classList.add("hidden");
dashboard.classList.remove("hidden");

document.querySelector(".logout").classList.remove("hidden");

let user=localStorage.user;

welcome.innerText="Welcome "+users[user].name;

if(user=="admin")
adminControls.classList.remove("hidden");

await loadData();

}


// LOAD DATA

async function loadData(){

let res=await fetch(API);
projects=await res.json();

filteredProjects=[...projects];

if(localStorage.user=="admin")
loadAssociateFilter();

renderTable();
calculateCompletion();

}


// RENDER TABLE

function renderTable(){

tbody.innerHTML="";

let user=localStorage.user;

filteredProjects.forEach((p)=>{

if(
user!="admin" &&
p["Associate Name"]?.trim().toLowerCase()!=users[user].name.toLowerCase()
) return;

let index=projects.indexOf(p);

tbody.innerHTML+=`

<tr>

<td>${p["Project Name"]}</td>

<td>${p["Transfer Ownership Email"]}</td>

<td>${dropdown(index,"Clarity Setup",["Yes","No","Not Sure"])}</td>

<td>${dropdown(index,"Clarity Ownership Access Shared",["Already Given","Done","I can’t give","I not have that project"])}</td>

<td>${dropdown(index,"Bing Setup",["Yes","No","Not Sure"])}</td>

<td>${dropdown(index,"Bing Ownership Access Shared",["Already Given","Done","I can’t give","I not have that project"])}</td>

<td>${dropdown(index,"GTM Access",["Yes","No","Not Sure"])}</td>

<td>${dropdown(index,"GTM Ownership Access Shared",["Already Given","Done","I can’t give","I not have that project"])}</td>

</tr>

`;

});

}


// DROPDOWN

function dropdown(index,field,options){

let value=projects[index][field]||"Not Sure";

let html=`<select onchange="update(${index},'${field}',this.value)">`;

options.forEach(o=>{
html+=`<option ${value==o?"selected":""}>${o}</option>`;
});

return html+"</select>";

}


// UPDATE

async function update(index,field,value){

projects[index][field]=value;

await fetch(API,{
method:"POST",
body:JSON.stringify(projects[index])
});

calculateCompletion();

}


// FILTER

function filterProjects(){

let search=searchBox.value.toLowerCase();
let associate=associateFilter.value;

filteredProjects=projects.filter(p=>{

let s=!search || p["Project Name"].toLowerCase().includes(search);
let a=!associate || p["Associate Name"]==associate;

return s && a;

});

renderTable();
calculateCompletion();

}


// LOAD ASSOCIATE FILTER

function loadAssociateFilter(){

let set=new Set();

projects.forEach(p=>set.add(p["Associate Name"]));

associateFilter.innerHTML='<option value="">All Associates</option>';

set.forEach(a=>{
associateFilter.innerHTML+=`<option>${a}</option>`;
});

}


// COMPLETION

function calculateCompletion(){

if(localStorage.user!="admin") return;

let total=projects.length;
let done=0;

projects.forEach(p=>{
if(p["Clarity Setup"]=="Yes" && p["Bing Setup"]=="Yes" && p["GTM Access"]=="Yes")
done++;
});

completionPercent.innerText=Math.round((done/total)*100)+"%";

}


// LOGOUT

function logout(){
localStorage.clear();
location.reload();
}


// AUTO LOGIN

if(localStorage.user)
showDashboard();


</script>

</body>
</html>
