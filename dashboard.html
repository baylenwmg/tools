<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Project Dashboard</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
margin:0;
}

.header{
background:#24292e;
color:white;
padding:15px;
font-size:20px;
}

.logout{
float:right;
background:red;
padding:5px 10px;
cursor:pointer;
border-radius:4px;
}

.container{
padding:20px;
}

.login-box{
width:320px;
margin:100px auto;
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.15);
}

input{
padding:8px;
margin:5px;
}

button{
background:#2ea44f;
color:white;
border:none;
padding:8px 15px;
cursor:pointer;
border-radius:4px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
margin-top:10px;
}

th, td{
padding:8px;
border:1px solid #ddd;
font-size:14px;
}

select{
width:100%;
}

.hidden{
display:none;
}

.controls{
background:white;
padding:10px;
margin-bottom:10px;
border-radius:6px;
}

</style>

</head>

<body>

<div class="header">
Project Dashboard
<span class="logout hidden" onclick="logout()">Logout</span>
</div>


<!-- LOGIN -->

<div id="login" class="login-box">

<h3>Login</h3>

<input id="userid" placeholder="Login ID"><br>
<input id="password" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="container hidden">

<h3 id="welcome"></h3>


<!-- ADMIN CONTROLS -->

<div id="adminControls" class="controls hidden">

<input
type="text"
id="searchBox"
placeholder="Search Project..."
onkeyup="adminFilterProjects()"
>

<select id="associateFilter" onchange="adminFilterProjects()">
<option value="">All Associates</option>
</select>

<span style="margin-left:20px;">
Completion: <b id="completionPercent">0%</b>
</span>

</div>


<table>

<thead>

<tr>

<th>Project Name</th>
<th>Transfer Ownership Email</th>

<th>Clarity Setup</th>
<th>Clarity Ownership Access Shared</th>

<th>Bing Setup</th>
<th>Bing Ownership Access Shared</th>

<th>GTM Access</th>
<th>GTM Ownership Access Shared</th>
<th>Previous Associate</th>

</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

</div>


<script>


// GOOGLE SHEET API
const API="https://script.google.com/macros/s/AKfycbyoHEPOPy89C0ST9KjYBMDPFmJoUVu0EE0i6A0Q8vCPxYi4kPzU07ECJvYaBmhS_qiY/exec";


// USERS
const users={

admin:{password:"admin@123",name:"Admin"},

user001:{password:"lrgUeJyCZ1",name:"Dipen"},
user002:{password:"s6xrLqjSaR",name:"Dishank"},
user003:{password:"zwfTRCO3Hp",name:"Harshil"},
user004:{password:"ll6qBvtf9E",name:"Jaimin"},
user005:{password:"r4WoT6wMZ3",name:"Kushal"},
user006:{password:"IaIoXs8ToJ",name:"Nikhil R"},
user007:{password:"nWEyIeRGc3",name:"Nitin"},
user008:{password:"gAH2WJ50ep",name:"Pratik"},
user009:{password:"lltLX0aTXP",name:"Prerak"},
user010:{password:"JEIBPrBpAj",name:"Riddhi"},
user011:{password:"dIwmBesG6P",name:"Rohan"},
user012:{password:"Ss8bDRtey0",name:"Shefali"},
user013:{password:"h9T6bZnNmr",name:"Twinkle"}

};


let projects=[];
let adminFilteredProjects=[];


// LOGIN

function login(){

let id=document.getElementById("userid").value;
let pass=document.getElementById("password").value;

if(users[id] && users[id].password===pass){

localStorage.user=id;
showDashboard();

}else{

alert("Invalid Login");

}

}


// SHOW DASHBOARD

async function showDashboard(){

document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");

document.querySelector(".logout").classList.remove("hidden");

let user=localStorage.user;

document.getElementById("welcome").innerText="Welcome "+users[user].name;

await loadData();

if(user==="admin"){

document.getElementById("adminControls").classList.remove("hidden");

adminFilteredProjects=[...projects];

adminLoadAssociateFilter();

adminCalculateCompletion();

}

}


// LOAD DATA

async function loadData(){

const res=await fetch(API);

projects=await res.json();

renderTable();

}


// RENDER TABLE (ORIGINAL SAFE)

function renderTable(){

const tbody=document.getElementById("tbody");

tbody.innerHTML="";

let user=localStorage.user;

projects.forEach((p,index)=>{

if(user!="admin" &&
p["Associate Name"]?.trim().toLowerCase()!==users[user].name.toLowerCase())
return;

let row=document.createElement("tr");

row.innerHTML=`

<td>${p["Project Name"]}</td>

<td>${p["Transfer Ownership Email"]}</td>

<td>${dropdown(index,"Clarity Setup",["Yes","No","Not Sure"])}</td>

<td>${dropdown(index,"Clarity Ownership Access Shared",["Already Given","Done","I can’t give","I not have that project"])}</td>

<td>${dropdown(index,"Bing Setup",["Yes","No","Not Sure"])}</td>

<td>${dropdown(index,"Bing Ownership Access Shared",["Already Given","Done","I can’t give","I not have that project"])}</td>

<td>${dropdown(index,"GTM Access",["Yes","No","Not Sure"])}</td>

<td>${dropdown(index,"GTM Ownership Access Shared",["Already Given","Done","I can’t give","I not have that project"])}</td>

<td>${p["Previous Associate"] || ""}</td>

`;

tbody.appendChild(row);

});

}


// DROPDOWN (ORIGINAL SAFE)

function dropdown(index,field,options){

let value=projects[index][field]||"Not Sure";

let html=`<select onchange="update(${index},'${field}',this.value)">`;

options.forEach(opt=>{

html+=`<option ${value==opt?"selected":""}>${opt}</option>`;

});

html+="</select>";

return html;

}


// UPDATE (ORIGINAL SAFE)

async function update(index,field,value){

projects[index][field]=value;

await fetch(API,{
method:"POST",
body:JSON.stringify(projects[index])
});

}


// LOGOUT

function logout(){

localStorage.clear();
location.reload();

}


// ADMIN FILTER

function adminFilterProjects(){

let search=document.getElementById("searchBox").value.toLowerCase();

let associate=document.getElementById("associateFilter").value;

adminFilteredProjects=projects.filter(p=>{

let matchSearch=!search||p["Project Name"].toLowerCase().includes(search);

let matchAssociate=!associate||p["Associate Name"]===associate;

return matchSearch&&matchAssociate;

});

adminRenderFiltered();

adminCalculateCompletion();

}


// RENDER FILTERED

function adminRenderFiltered(){

const tbody=document.getElementById("tbody");

tbody.innerHTML="";

adminFilteredProjects.forEach(p=>{

let index=projects.indexOf(p);

tbody.innerHTML+=`

<tr>

<td>${p["Project Name"]}</td>

<td>${p["Transfer Ownership Email"]}</td>

<td>${dropdown(index,"Clarity Setup",["Yes","No","Not Sure"])}</td>

<td>${dropdown(index,"Clarity Ownership Access Shared",["Already Given","Done","I can’t give","I not have that project"])}</td>

<td>${dropdown(index,"Bing Setup",["Yes","No","Not Sure"])}</td>

<td>${dropdown(index,"Bing Ownership Access Shared",["Already Given","Done","I can’t give","I not have that project"])}</td>

<td>${dropdown(index,"GTM Access",["Yes","No","Not Sure"])}</td>

<td>${dropdown(index,"GTM Ownership Access Shared",["Already Given","Done","I can’t give","I not have that project"])}</td>

<td>${p["Previous Associate"] || ""}</td>

</tr>

`;

});

}


// LOAD ASSOCIATE FILTER

function adminLoadAssociateFilter(){

let filter=document.getElementById("associateFilter");

let set=new Set();

projects.forEach(p=>set.add(p["Associate Name"]));

filter.innerHTML='<option value="">All Associates</option>';

set.forEach(a=>{

filter.innerHTML+=`<option>${a}</option>`;

});

}


// COMPLETION

function adminCalculateCompletion(){

let total=projects.length;
let done=0;

projects.forEach(p=>{

if(p["Clarity Setup"]==="Yes" &&
p["Bing Setup"]==="Yes" &&
p["GTM Access"]==="Yes")
done++;

});

document.getElementById("completionPercent").innerText=
Math.round((done/total)*100)+"%";

}


// AUTO LOGIN

if(localStorage.user){

showDashboard();

}


</script>

</body>
</html>
