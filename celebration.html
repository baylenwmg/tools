<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Content Highlighter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/css/suneditor.min.css"> 
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --brand-color: #c92d9a;
            --keyword-color: #ebe538;
            --location-color: #15f5f7;
            --text: #f1f5f9;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .workspace { max-width: 1200px; margin: 0 auto; }
        header { margin-bottom: 30px; border-left: 4px solid var(--primary); padding-left: 20px; }
        h1 { font-weight: 700; margin: 0; font-size: 1.8rem; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; }
        .step-tag { display: inline-block; background: rgba(56, 189, 248, 0.1); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
        .main-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; }
        textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; padding: 12px; box-sizing: border-box; font-family: 'Inter', sans-serif; resize: vertical; margin-bottom: 15px; }
        .editor-container { display: flex; flex-direction: column; gap: 20px; }
        .actions { display: flex; gap: 12px; margin-top: 20px;}
        .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn.primary { background: var(--primary); color: #0f172a; }
        .btn.primary:hover { background: #7dd3fc; transform: translateY(-2px); }
        .btn.outline { background: transparent; border: 1px solid #334155; color: white; }

        /* Highlights */
        .hl-brand { background-color: var(--brand-color) !important; color: #fff !important; font-weight: bold; border-radius: 3px; padding: 0 2px; }
        .hl-keyword { background-color: var(--keyword-color) !important; color: #000 !important; font-weight: bold; border-radius: 3px; padding: 0 2px; }
        .hl-location { background-color: var(--location-color) !important; color: #000 !important; font-weight: bold; border-radius: 3px; padding: 0 2px; }

        .summary-bar { position: sticky; bottom: 20px; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--primary); padding: 15px 30px; border-radius: 50px; display: flex; justify-content: space-around; margin-top: 20px; }
        .stat-val { display: block; font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; }
        .unused-list h4 { font-size: 0.8rem; font-weight: 700; margin: 10px 0; border-bottom: 1px solid #334155; padding-bottom: 5px;}
        .unused-list ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
        .unused-list li { background: #2c3a4f; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div class="workspace">
        <header>
            <h1>Highlighter</h1>
            <p class="subtitle">Agency Audit Tool</p>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <div class="card">
                    <span class="step-tag">Step 1: Inputs</span>
                    <label>Brand Names</label>
                    <textarea id="brand" rows="3" placeholder="Brand Name..."></textarea>
                    <label>Keywords</label>
                    <textarea id="keywords" rows="3" placeholder="SEO, Marketing..."></textarea>
                    <label>Locations</label>
                    <textarea id="locations" rows="3" placeholder="Sydney, Melbourne..."></textarea>
                </div>
                <div class="card" id="unused-keywords-card" style="display: none; margin-top: 20px;">
                    <span class="step-tag">Unused Terms</span>
                    <div id="unused-keywords-container"></div>
                </div>
            </aside>

            <main class="editor-container">
                <div class="card">
                    <span class="step-tag">Step 2: Content</span>
                    <textarea id="content_editor"></textarea>
                    <div class="actions" style="margin-top: 20px;">
    <button class="btn primary" onclick="highlightText()"> Run Highlight</button>
    <button class="btn outline" onclick="downloadWord()">💾 Export to Word</button>
    <button class="btn outline" onclick="clearEditor()">Clear Editor</button>
</div>
                </div>

                <div class="summary-bar">
                    <div class="stat"><span class="stat-val" id="count-brand">0</span><span class="stat-label">Brands</span></div>
                    <div class="stat"><span class="stat-val" id="count-keyword">0</span><span class="stat-label">Keywords</span></div>
                    <div class="stat"><span class="stat-val" id="count-location">0</span><span class="stat-label">Locations</span></div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/suneditor.min.js"></script>
    <script src="js/highlighter.js"></script>
    <script>
        // Global Editor Instance
        const sunEditorInstance = SUNEDITOR.create('content_editor', {
            buttonList: [['undo', 'redo', 'formatBlock', 'list', 'bold', 'underline', 'italic']],
            width: '100%',
            height: '400px',
            placeholder: "Paste your content here..."
        });
    </script>
</body>
</html>
