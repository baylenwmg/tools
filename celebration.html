<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Name, Keyword and Location Highlighter</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/css/suneditor.min.css">

    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --brand-color: #c92d9a;
            --keyword-color: #ebe538;
            --location-color: #15f5f7;
            --text: #f1f5f9;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .workspace {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            border-left: 4px solid var(--primary);
            padding-left: 20px;
        }

        h1 { margin: 0; font-size: 1.8rem; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; }

        .step-tag {
            display: inline-block;
            background: rgba(56,189,248,0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            padding: 12px;
            resize: vertical;
            margin-bottom: 15px;
        }

        .editor {
            min-height: 400px;
            background: white;
            color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            font-size: 1.05rem;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .btn.primary {
            background: var(--primary);
            color: #0f172a;
        }

        .btn.outline {
            background: transparent;
            border: 1px solid #334155;
            color: white;
        }

        /* Highlight Styles */
        .hl-brand { background: var(--brand-color); color: #fff; padding: 2px 4px; border-radius: 4px; }
        .hl-keyword { background: var(--keyword-color); color: #000; padding: 2px 4px; border-radius: 4px; }
        .hl-location { background: var(--location-color); color: #000; padding: 2px 4px; border-radius: 4px; }

        /* Summary Bar */
        .summary-bar {
            position: sticky;
            bottom: 20px;
            background: rgba(30,41,59,0.9);
            border-radius: 50px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-around;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #94a3b8;
        }

        /* Unused Keywords */
        .unused-list li {
            background: #2c3a4f;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
        }

        /* Variant Match Indicator */
        .variant-list li {
            background: #1f2937;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            color: #fbbf24;
            border: 1px dashed #fbbf24;
        }
    </style>
</head>

<body>

<div class="workspace">
    <header>
        <h1>Highlighter</h1>
        <p class="subtitle">Add Brand, Keyword, and Locations Below</p>
    </header>

    <div class="main-layout">
        <aside>
            <div class="card">
                <span class="step-tag">Step 1: Configuration</span>

                <label>Brand Names</label>
                <textarea id="brand"></textarea>

                <label>Primary Keywords</label>
                <textarea id="keywords"></textarea>

                <label>Locations</label>
                <textarea id="locations"></textarea>
            </div>

            <div class="card" id="unused-keywords-card" style="display:none;">
                <span class="step-tag">Step 3: Unused Keywords</span>
                <div id="unused-keywords-container"></div>
            </div>

            <!-- ✅ NEW: Variant Indicator -->
            <div class="card" id="variant-match-card" style="display:none;">
                <span class="step-tag">Step 4: Matched as Plural / Variant</span>
                <div id="variant-match-container"></div>
            </div>
        </aside>

        <main>
            <div class="card">
                <span class="step-tag">Step 2: Content</span>
                <div id="content" class="editor" contenteditable="true">
                    Paste your content here...
                </div>

                <div class="actions">
                    <button class="btn primary" onclick="highlightText()">Run Highlight</button>
                    <button class="btn outline" onclick="downloadWord()">Export to Word</button>
                    <button class="btn outline" onclick="clearEditor()">Clear Editor</button>
                </div>
            </div>

            <div class="summary-bar">
                <div>
                    <span class="stat-val" id="count-brand">0</span>
                    <div class="stat-label">Brands</div>
                </div>
                <div>
                    <span class="stat-val" id="count-keyword">0</span>
                    <div class="stat-label">Keywords</div>
                </div>
                <div>
                    <span class="stat-val" id="count-location">0</span>
                    <div class="stat-label">Locations</div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/suneditor.min.js"></script>
<script>
    let editor;
    editor = SUNEDITOR.create('content', {
        buttonList: [['formatBlock', 'list']],
        defaultStyle: "font-family: Arial; font-size: 16px;"
    });

    function clearEditor() {
        editor.setContents('');
    }
</script>

<script src="js/highlighter.js"></script>
</body>
</html>
